name: ok2026
display_name: Ok child of Hummingbird 2026
version: 9.2.0
author:
  name: "From PrestaShop Team by Dario Savella"
  email: "admin@itomo.tech"
  url: "https://www.prestashop-project.org/"

meta:
  compatibility:
    from: 9.1.2
    to: ~9.1.2
    framework: bootstrap-v5.3.3

  available_layouts:
    layout-full-width:
      name: Full Width
      description: No side columns, ideal for distraction-free pages such as product pages.
    layout-both-columns:
      name: Three Columns
      description: One large central column and 2 side columns.
    layout-left-column:
      name: Two Columns, small left column
      description: Two columns with a small left column
    layout-right-column:
      name: Two Columns, small right column
      description: Two columns with a small right column

global_settings:
  configuration:
    PS_IMAGE_QUALITY: png
    HOME_FEATURED_NBR: 4
    NEW_PRODUCTS_NBR: 4
    BLOCKSPECIALS_SPECIALS_NBR: 4
    PS_BLOCK_BESTSELLERS_TO_DISPLAY: 4
    PRODUCTS_VIEWED_NBR: 4
    CATEGORYPRODUCTS_DISPLAY_PRODUCTS: 4
    PSR_ICON_COLOR: "#0b69f6"
    PSR_TEXT_COLOR: "#212529"
  modules:
    to_enable:
      - ps_linklist
      - okcustom2021
      - ps_categorytree
      - ps_shoppingcart
      - ps_socialfollow
      - psgdpr
    to_disable:
      - blockreassurance
      - blockwishlist
      - productcomments
      - ps_bestesellers
      - ps_brandlist
      - ps_categoryproduct
      - ps_featuredproducts
      - ps_facetedsearch
      - ps_banner
      - ps_currencyselector
      - ps_viewedproduct
      - ps_sharebuttons
      - ps_specials
      - ps_supplierlist
      - psshipping
      - statsbestcategories
      - statsbestcustomers
      - statsbestmanufacturers
      - statsbestproducts
      - statsbestsuppliers
      - statsbestvouchers
      - statscarrier
      - statscatalog
      - statscheckup
      - statsdata
      - statsforecast
      - statsnewsletter
      - statspersonalinfos
      - statsproduct
      - statsregistrations
      - statssales
      - statssearch
      - statsstock
  hooks:
    modules_to_unhook:
#      displayFooter:
#        - ps_socialfollow
#      displaySearch:
#        - ps_searchbar
      displayNav1:
        - ps_contactinfo
      displayFooter:
        - ps_contactinfo
    modules_to_hook:
      displayNav2:
        - ps_languageselector
        - ps_customersignin
        - ps_shoppingcart
        # Keep existing hooks and append them after
        - ~
      displayTop:
        - ps_mainmenu
        - ps_searchbar
        # Keep existing hooks and append them after
        - ~
      displayHome:
        - ps_imageslider
        - ps_customtext
        - ps_categorytree
        # Keep existing hooks and append them after
        - ~
      displayFooterBefore:
        - ps_socialfollow
        - ps_emailsubscription
        # Keep existing hooks and append them after
        - ~
      displayFooter:
        - ps_linklist
        - ps_customeraccountlinks
        - ps_contactinfo
        # Keep existing hooks and append them after
        - ~
      displayContactContent:
        - contactform
        # Keep existing hooks and append them after
        - ~
      displayCustomerAccount:
        - ps_emailalerts
        - psgdpr
        # Keep existing hooks and append them after
        - ~
      displayGDPRConsent:
        - psgdpr
        # Keep existing hooks and append them after
        - ~

  image_types:
    cart_default:
      width: 125
      height: 125
      scope: [products]
    small_default:
      width: 98
      height: 98
      scope: [products, categories, manufacturers, suppliers]
    medium_default:
      width: 452
      height: 452
      scope: [products, manufacturers, suppliers]
    large_default:
      width: 800
      height: 800
      scope: [products, manufacturers, suppliers]
    home_default:
      width: 250
      height: 250
      scope: [products]
    category_default:
      width: 180
      height: 180
      scope: [categories]
    stores_default:
      width: 287
      height: 160
      scope: [stores]
    default_xs:
      width: 160
      height: 160
      scope: [products, manufacturers, suppliers, categories]
    default_sm:
      width: 216
      height: 216
      scope: [categories, products]
    default_md:
      width: 261
      height: 261
      scope: [manufacturers, suppliers, products, categories]
    default_lg:
      width: 336
      height: 336
      scope: [categories, products]
    default_xl:
      width: 400
      height: 400
      scope: [products]
    product_main:
      width: 720
      height: 720
      scope: [products]
    category_cover:
      width: 1000
      height: 200
      scope: [categories]
    product_main_2x:
      width: 1440
      height: 1440
      scope: [products]
    category_cover_2x:
      width: 2000
      height: 400
      scope: [categories]

theme_settings:
  rtl_generation: false
  default_layout: layout-full-width
  layouts:
    category: layout-full-width
    best-sales: layout-full-width
    new-products: layout-full-width
    prices-drop: layout-full-width
    contact: layout-full-width
    manufacturer: layout-full-width
    supplier: layout-full-width
